{% extends "menu/base.html" %}

{% block search_bar %}{% endblock %}

{% block content %}

<div class="flex items-center justify-center min-h-[80vh] py-12">
    <div
        class="glass w-full max-w-md p-10 rounded-3xl border border-gray-800 shadow-[0_0_40px_rgba(220,38,38,0.2)] text-center">

        <!-- Icon -->
        <div class="flex justify-center mb-6">
            <div class="bg-green-600/20 rounded-full p-4 border border-green-500/40">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-400" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </div>
        </div>

        <h2 class="text-3xl font-extrabold text-white mb-3">Check Your Inbox</h2>
        <p class="text-gray-400 text-sm mb-3">
            If an account with that email exists, we've sent a password reset link.
        </p>
        <p class="text-gray-500 text-xs italic mb-8">
            Don't see it? Check your spam or junk folder.
        </p>

        <a href="{% url 'login' %}" class="w-full block bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl
                   shadow-[0_4px_14px_0_rgba(220,38,38,0.39)] hover:shadow-[0_6px_20px_rgba(220,38,38,0.23)]
                   hover:-translate-y-0.5 transition ease-in-out">
            Return to Login
        </a>

        <div class="mt-6 text-center text-sm text-gray-500">
            Wrong email?
            <a href="{% url 'password_reset' %}" class="text-white hover:text-red-500 font-bold transition ml-1">Try
                again</a>
        </div>
    </div>
</div>

{% endblock %}

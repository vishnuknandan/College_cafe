{% extends 'menu/base.html' %}
{% block content %}

<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">

        <!-- Header -->
        <div class="text-center mb-10">
            <div class="text-6xl mb-4">🔑</div>
            <h1 class="text-3xl font-extrabold text-white mb-2">Set New Password</h1>
            <p class="text-gray-400">OTP verified! Choose a strong new password.</p>
        </div>

        <!-- Card -->
        <div class="glass rounded-3xl p-8 border border-red-900/30 shadow-2xl">

            <!-- Messages -->
            {% for message in messages %}
            <div class="mb-4 p-3 rounded-xl text-sm font-medium
                {% if message.tags == 'danger' %}bg-red-900/40 border border-red-500/50 text-red-300
                {% else %}bg-green-900/40 border border-green-500/50 text-green-300{% endif %}">
                {{ message }}
            </div>
            {% endfor %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-gray-400 text-sm mb-2 font-medium">New Password</label>
                    <div class="relative">
                        <input type="password" name="new_password" id="new_password" required
                            placeholder="Minimum 6 characters"
                            class="w-full bg-gray-800/80 text-white border border-gray-700 rounded-xl px-4 py-3 pr-12 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
                        <button type="button" onclick="togglePwd('new_password', 'eye1')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition">
                            <span id="eye1">👁️</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 text-sm mb-2 font-medium">Confirm Password</label>
                    <div class="relative">
                        <input type="password" name="confirm_password" id="confirm_password" required
                            placeholder="Repeat your new password"
                            class="w-full bg-gray-800/80 text-white border border-gray-700 rounded-xl px-4 py-3 pr-12 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
                        <button type="button" onclick="togglePwd('confirm_password', 'eye2')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition">
                            <span id="eye2">👁️</span>
                        </button>
                    </div>
                </div>

                <!-- Strength bar -->
                <div>
                    <div class="flex gap-1 mt-1">
                        <div id="s1" class="h-1 flex-1 rounded-full bg-gray-700 transition-colors duration-300"></div>
                        <div id="s2" class="h-1 flex-1 rounded-full bg-gray-700 transition-colors duration-300"></div>
                        <div id="s3" class="h-1 flex-1 rounded-full bg-gray-700 transition-colors duration-300"></div>
                        <div id="s4" class="h-1 flex-1 rounded-full bg-gray-700 transition-colors duration-300"></div>
                    </div>
                    <p id="strength-label" class="text-xs text-gray-500 mt-1"></p>
                </div>

                <button type="submit"
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition duration-300 transform hover:scale-[1.02] shadow-xl mt-2">
                    🔒 Save New Password
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    function togglePwd(fieldId, eyeId) {
        const field = document.getElementById(fieldId);
        field.type = (field.type === 'password') ? 'text' : 'password';
    }

    document.getElementById('new_password').addEventListener('input', function () {
        const val = this.value;
        const bars = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3'), document.getElementById('s4')];
        const label = document.getElementById('strength-label');
        bars.forEach(b => b.style.backgroundColor = '#374151');

        let strength = 0;
        if (val.length >= 6) strength++;
        if (val.length >= 10) strength++;
        if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength++;
        if (/[^A-Za-z0-9]/.test(val)) strength++;

        const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
        const labels = ['Weak', 'Fair', 'Good', 'Strong'];
        for (let i = 0; i < strength; i++) bars[i].style.backgroundColor = colors[strength - 1];
        label.textContent = strength ? labels[strength - 1] : '';
        label.style.color = strength ? colors[strength - 1] : '#6b7280';
    });
</script>

{% endblock %}

{% extends 'menu/base.html' %}
{% block content %}

<script>
    window.onpopstate = function () {
        // Redirect to home page
        window.location.replace("{% url 'home' %}");
    };
    history.pushState(null, null, location.href);
</script>

<div class="flex flex-col items-center justify-center py-20 min-h-[60vh] text-center fade-in">

    <!-- Celebration Icon -->
    <div
        class="w-24 h-24 bg-green-500 rounded-full flex items-center justify-center text-5xl shadow-[0_0_30px_rgba(34,197,94,0.6)] mb-8 animate-bounce">
        ✅
    </div>

    <h2 class="text-5xl font-extrabold text-white mb-4">Order Confirmed!</h2>
    <p class="text-gray-300 text-lg max-w-lg mb-8 leading-relaxed">
        Your delicious food is being prepared with ❤️. <br> Get your gaming setup ready!
    </p>

    <div class="flex gap-4">
        <a href="{% url 'my_orders' %}"
            class="glass border border-white/20 text-white font-bold py-3 px-8 rounded-full hover:bg-white/10 transition">
            View Order
        </a>
        <a href="{% url 'home' %}"
            class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">
            Back to Home
        </a>
    </div>

</div>

{% endblock %}

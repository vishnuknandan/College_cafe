{% extends "menu/base.html" %}

{% block search_bar %}{% endblock %}

{% block content %}

<div class="flex items-center justify-center min-h-[80vh] py-12">
    <div
        class="glass w-full max-w-md p-10 rounded-3xl border border-gray-800 shadow-[0_0_40px_rgba(220,38,38,0.2)] text-center">

        <!-- Success Icon -->
        <div class="flex justify-center mb-6">
            <div class="bg-green-600/20 rounded-full p-4 border border-green-500/40">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-400" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
        </div>

        <h2 class="text-3xl font-extrabold text-white mb-3">Password Changed!</h2>
        <p class="text-gray-400 text-sm mb-8">
            Your password has been updated successfully. You can now sign in with your new password.
        </p>

        <a href="{% url 'login' %}" class="w-full block bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl
                   shadow-[0_4px_14px_0_rgba(220,38,38,0.39)] hover:shadow-[0_6px_20px_rgba(220,38,38,0.23)]
                   hover:-translate-y-0.5 transition ease-in-out">
            Sign In Now
        </a>

    </div>
</div>

{% endblock %}

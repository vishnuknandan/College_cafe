{% extends 'menu/base.html' %}
{% block content %}

<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">

        <!-- Header -->
        <div class="text-center mb-10">
            <div class="text-6xl mb-4">🔐</div>
            <h1 class="text-3xl font-extrabold text-white mb-2">Change Password</h1>
            <p class="text-gray-400">We'll send a 6-digit OTP to your registered email.</p>
        </div>

        <!-- Card -->
        <div class="glass rounded-3xl p-8 border border-red-900/30 shadow-2xl">

            <!-- Messages -->
            {% for message in messages %}
            <div class="mb-4 p-3 rounded-xl text-sm font-medium
                {% if message.tags == 'danger' %}bg-red-900/40 border border-red-500/50 text-red-300
                {% else %}bg-green-900/40 border border-green-500/50 text-green-300{% endif %}">
                {{ message }}
            </div>
            {% endfor %}

            <div class="mb-6 bg-gray-800/60 rounded-xl p-4 flex items-center gap-3">
                <span class="text-2xl">📧</span>
                <div>
                    <p class="text-gray-400 text-xs uppercase tracking-wider mb-1">OTP will be sent to</p>
                    <p class="text-white font-semibold">{{ email }}</p>
                </div>
            </div>

            <form method="POST">
                {% csrf_token %}
                <button type="submit"
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition duration-300 transform hover:scale-[1.02] shadow-xl flex items-center justify-center gap-2">
                    <span>📨</span> Send OTP
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'profile' %}" class="text-gray-500 hover:text-gray-300 text-sm transition">
                    ← Back to Profile
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}

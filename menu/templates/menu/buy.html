        <!-- Checkout Summary -->
        <div class="lg:w-1/3">
            <div class="glass p-8 rounded-3xl border border-red-900/30 sticky top-24">
                <h3 class="text-2xl font-bold text-white mb-6">Order Summary</h3>

                <div class="space-y-3 mb-6">
                    <div class="flex justify-between text-gray-400">
                        <span>Subtotal</span>
                        <span class="text-white">₹{{ total_price }}</span>
                    </div>
                    <div class="flex justify-between text-gray-400">
                        <span>Taxes (Included)</span>
                        <span class="text-green-500">₹0</span>
                    </div>
                    <div class="border-t border-gray-700 pt-3 flex justify-between text-xl font-bold text-white">
                        <span>Total</span>
                        <span class="text-red-500">₹{{ total_price }}</span>
                    </div>
                </div>

                <a href="{% url 'checkout' %}"
                    class="block w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl text-center shadow-[0_4px_14px_0_rgba(220,38,38,0.39)] hover:shadow-[0_6px_20px_rgba(220,38,38,0.23)] hover:-translate-y-0.5 transition ease-in-out">
                    Proceed to Checkout 🚀
                </a>

                <p class="text-center text-gray-500 text-xs mt-4">Safe & Secure Payment</p>
            </div>
        </div>
<form method="POST" class="space-y-4">
    {% csrf_token %}
    <input type="hidden" name="qty" value="{{ qty }}">

    <div style="display:none;">
        {{ form }}
    </div>

    <button type="submit"
        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-lg mt-6 text-lg transition">
        Confirm Order - ₹{{ total_price }}
    </button>
</form>
</div>

{% endblock %}

{% extends 'menu/base.html' %}
{% block content %}

<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">

        <!-- Header -->
        <div class="text-center mb-10">
            <div class="text-6xl mb-4">🔢</div>
            <h1 class="text-3xl font-extrabold text-white mb-2">Verify OTP</h1>
            <p class="text-gray-400">Enter the 6-digit code sent to your email.</p>
        </div>

        <!-- Card -->
        <div class="glass rounded-3xl p-8 border border-red-900/30 shadow-2xl">

            <!-- Messages -->
            {% for message in messages %}
            <div class="mb-4 p-3 rounded-xl text-sm font-medium
                {% if message.tags == 'danger' %}bg-red-900/40 border border-red-500/50 text-red-300
                {% else %}bg-green-900/40 border border-green-500/50 text-green-300{% endif %}">
                {{ message }}
            </div>
            {% endfor %}

            <form method="POST">
                {% csrf_token %}

                <!-- 6-digit OTP boxes -->
                <div class="flex justify-center gap-3 mb-8">
                    {% for i in "123456" %}
                    <input type="text" name="otp_{{ forloop.counter }}" id="otp_{{ forloop.counter }}" maxlength="1"
                        inputmode="numeric" autocomplete="off"
                        class="otp-input w-12 h-14 text-center text-2xl font-bold bg-gray-800 text-white border-2 border-gray-600 rounded-xl focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/40 transition">
                    {% endfor %}
                </div>

                <button type="submit"
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition duration-300 transform hover:scale-[1.02] shadow-xl">
                    ✅ Verify OTP
                </button>
            </form>

            <div class="mt-6 text-center space-y-2">
                <a href="{% url 'profile_pwd_otp_request' %}"
                    class="text-red-400 hover:text-red-300 text-sm transition block">
                    🔄 Resend OTP
                </a>
                <a href="{% url 'profile' %}" class="text-gray-500 hover:text-gray-300 text-sm transition block">
                    ← Back to Profile
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    var inputs = document.querySelectorAll('.otp-input');
    inputs.forEach(function (inp, idx) {
        inp.addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value.length === 1 && idx < inputs.length - 1) {
                inputs[idx + 1].focus();
            }
        });
        inp.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace' && this.value === '' && idx > 0) {
                inputs[idx - 1].focus();
            }
        });
    });
    inputs[0].focus();
</script>

{% endblock %}
